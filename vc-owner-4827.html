<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Venegas Construction Owner Dashboard</title>
<style>
:root{--bg:#111827;--card:#1f2937;--inner:#0f172a;--text:#f9fafb;--muted:#9ca3af;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;padding:18px}
.wrap{max-width:820px;margin:auto}.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px}
input,button{width:100%;min-height:48px;border-radius:10px;font-size:16px;padding:11px 12px}
input{border:1px solid #4b5563;background:var(--inner);color:#fff}button{border:0;background:var(--red);color:#fff;font-weight:800;margin-top:10px}
.hidden{display:none!important}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--inner);border-radius:12px;padding:12px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:5px}
.employee{background:var(--inner);border-radius:12px;padding:14px;margin-top:10px}.shift{border-top:1px solid #374151;padding-top:10px;margin-top:10px}
.photo{width:110px;height:90px;object-fit:cover;border-radius:8px;margin-top:8px}
@media(max-width:600px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
  <h1 style="margin-top:0">Venegas Construction Owner</h1>
  <p class="muted">Private cloud dashboard</p>
</section>

<section id="login" class="card">
  <label>Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="Owner email">
  <label>Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password">
  <button id="loginBtn" type="button">Sign In</button>
  <p id="loginMsg" class="muted"></p>
</section>

<section id="dashboard" class="hidden">
  <section class="card">
    <div class="stats">
      <div class="stat"><span>Employees</span><strong id="employeeCount">0</strong></div>
      <div class="stat"><span>Clocked In</span><strong id="activeCount">0</strong></div>
      <div class="stat"><span>Total Hours</span><strong id="totalHours">0.00</strong></div>
    </div>
    <button id="refreshBtn" type="button">Refresh</button>
    <button id="signOutBtn" type="button" style="background:#374151">Sign Out</button>
  </section>

  <section class="card">
    <h2 style="margin-top:0">Employees & Hours</h2>
    <div id="employees"><p class="muted">Loading...</p></div>
  </section>
</section>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./config.js";

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);

function hours(a,b){ return Math.max(0,(b-a)/3600000); }

async function login(){
  const email = $("email").value.trim();
  const password = $("password").value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ $("loginMsg").textContent = "Sign in failed."; return; }
  await showDashboard();
}

async function showDashboard(){
  const { data:{ user } } = await supabase.auth.getUser();
  if(!user){ $("login").classList.remove("hidden"); $("dashboard").classList.add("hidden"); return; }

  const { data: ownerRow } = await supabase
    .from("owners")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if(!ownerRow){
    $("loginMsg").textContent = "This account is not an owner.";
    await supabase.auth.signOut();
    return;
  }

  $("login").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  await loadDashboard();
}

async function signedPhoto(path){
  const { data, error } = await supabase.storage
    .from("jobsite-photos")
    .createSignedUrl(path, 300);
  return error ? null : data.signedUrl;
}

async function loadDashboard(){
  const { data: entries, error } = await supabase
    .from("time_entries")
    .select("id, worker_name, clock_in, clock_out")
    .order("clock_in", { ascending:false });
  if(error){ $("employees").innerHTML='<p class="muted">Could not load records.</p>'; return; }

  const { data: photos } = await supabase
    .from("job_photos")
    .select("time_entry_id, storage_path");

  const photoMap = new Map((photos||[]).map(p=>[p.time_entry_id,p.storage_path]));
  const groups = new Map();
  const now = Date.now();
  let total = 0, active = 0;

  for(const e of entries||[]){
    const key = e.worker_name.trim() || "Unnamed Worker";
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(e);

    const a = new Date(e.clock_in).getTime();
    const b = e.clock_out ? new Date(e.clock_out).getTime() : now;
    total += hours(a,b);
    if(!e.clock_out) active++;
  }

  $("employeeCount").textContent = groups.size;
  $("activeCount").textContent = active;
  $("totalHours").textContent = total.toFixed(2);

  const box = $("employees");
  box.innerHTML = "";

  for(const [name, shifts] of groups){
    let employeeHours = 0;
    const employee = document.createElement("div");
    employee.className = "employee";

    const title = document.createElement("div");
    title.innerHTML = `<strong>${name}</strong>`;
    employee.appendChild(title);

    for(const s of shifts){
      const a = new Date(s.clock_in).getTime();
      const b = s.clock_out ? new Date(s.clock_out).getTime() : now;
      const h = hours(a,b);
      employeeHours += h;

      const shift = document.createElement("div");
      shift.className = "shift";
      shift.innerHTML = `<div>${new Date(s.clock_in).toLocaleString()}</div>
        <div class="muted">${s.clock_out ? "Out: "+new Date(s.clock_out).toLocaleString() : "Currently clocked in"}</div>
        <strong>${h.toFixed(2)} hrs</strong>`;

      const path = photoMap.get(s.id);
      if(path){
        const url = await signedPhoto(path);
        if(url){
          const img = document.createElement("img");
          img.className = "photo";
          img.src = url;
          img.alt = "Private jobsite photo";
          shift.appendChild(img);
        }
      }
      employee.appendChild(shift);
    }

    const totalLine = document.createElement("div");
    totalLine.style.marginTop = "12px";
    totalLine.innerHTML = `<strong>Total: ${employeeHours.toFixed(2)} hrs</strong>`;
    employee.insertBefore(totalLine, employee.children[1] || null);
    box.appendChild(employee);
  }

  if(!groups.size) box.innerHTML='<p class="muted">No employee records yet.</p>';
}

$("loginBtn").addEventListener("click", login);
$("refreshBtn").addEventListener("click", loadDashboard);
$("signOutBtn").addEventListener("click", async()=>{ await supabase.auth.signOut(); location.reload(); });

showDashboard();
</script>
</body>
</html>
