<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Venegas Construction Owner Dashboard</title>
<style>
:root{--bg:#111827;--card:#1f2937;--inner:#0f172a;--text:#f9fafb;--muted:#9ca3af;--red:#b91c1c;--green:#15803d;--blue:#2563eb;--amber:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:920px;margin:auto}.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px}label{display:block;font-weight:800;margin:12px 0 6px}
input,button{width:100%;min-height:48px;border-radius:10px;font-size:16px;padding:11px 12px}input{border:1px solid #4b5563;background:var(--inner);color:#fff}button{border:0;background:var(--red);color:#fff;font-weight:800;margin-top:10px}.secondary{background:#374151}.hidden{display:none!important}.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--inner);border-radius:12px;padding:12px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:5px}
.employee{background:var(--inner);border-radius:12px;padding:14px;margin-top:10px}.employeeTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.active{background:#14532d}.pending{background:#78350f}.approved{background:#14532d}.rejected{background:#7f1d1d}
.shift{border-top:1px solid #374151;padding-top:10px;margin-top:10px}.shiftGrid{display:grid;grid-template-columns:1fr auto;gap:8px}.photo{width:150px;height:110px;object-fit:cover;border-radius:8px;margin-top:8px;border:1px solid #374151}.mapLink{display:inline-block;margin-top:7px;color:#93c5fd;text-decoration:none;font-weight:700}.meta{font-size:13px;color:var(--muted);margin-top:4px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.shiftGrid{grid-template-columns:1fr}.photo{width:100%;height:auto;max-height:260px}}
</style>
</head>
<body>
<main class="wrap">
<section class="card"><h1 style="margin-top:0">Venegas Construction Owner</h1><p class="muted">Private live cloud dashboard</p></section>

<section id="login" class="card">
  <label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Owner email">
  <label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password">
  <button id="loginBtn" type="button">Sign In</button><p id="loginMsg" class="muted"></p>
</section>

<section id="dashboard" class="hidden">
  <section class="card">
    <div class="stats">
      <div class="stat"><span>Employees</span><strong id="employeeCount">0</strong></div>
      <div class="stat"><span>Clocked In</span><strong id="activeCount">0</strong></div>
      <div class="stat"><span>Total Hours</span><strong id="totalHours">0.00</strong></div>
      <div class="stat"><span>Pending</span><strong id="pendingCount">0</strong></div>
    </div>
    <button id="refreshBtn" type="button">Refresh</button><button id="signOutBtn" type="button" class="secondary">Sign Out</button>
  </section>
  <section class="card"><h2 style="margin-top:0">Employees, Hours & GPS</h2><div id="employees"><p class="muted">Loading...</p></div></section>
</section>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./config.js";
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);
let liveChannel = null;
function hours(a,b){ return Math.max(0,(b-a)/3600000); }
function el(tag, cls, text){ const n=document.createElement(tag); if(cls) n.className=cls; if(text!==undefined) n.textContent=text; return n; }
function mapUrl(lat,lng){ return `https://www.google.com/maps?q=${encodeURIComponent(lat+','+lng)}`; }

async function login(){
  $("loginMsg").textContent = "Signing in...";
  const { error } = await supabase.auth.signInWithPassword({ email:$("email").value.trim(), password:$("password").value });
  if(error){ $("loginMsg").textContent = "Sign in failed."; return; }
  $("loginMsg").textContent = ""; await showDashboard();
}

async function showDashboard(){
  const { data:{ user } } = await supabase.auth.getUser();
  if(!user){ $("login").classList.remove("hidden"); $("dashboard").classList.add("hidden"); return; }
  const { data: ownerRow, error } = await supabase.from("owners").select("user_id").eq("user_id", user.id).maybeSingle();
  if(error || !ownerRow){ $("loginMsg").textContent = "This account is not an owner."; await supabase.auth.signOut(); return; }
  $("login").classList.add("hidden"); $("dashboard").classList.remove("hidden");
  await loadDashboard();
  if(liveChannel) await supabase.removeChannel(liveChannel);
  liveChannel = supabase.channel("owner-live")
    .on("postgres_changes", {event:"*",schema:"public",table:"time_entries"}, () => loadDashboard().catch(console.error))
    .on("postgres_changes", {event:"*",schema:"public",table:"project_photos"}, () => loadDashboard().catch(console.error))
    .subscribe();
}

async function signedPhoto(path){
  const { data, error } = await supabase.storage.from("jobsite-photos").createSignedUrl(path, 300);
  return error ? null : data.signedUrl;
}

async function loadDashboard(){
  const { data: entries, error } = await supabase.from("time_entries")
    .select("id, worker_name, project, clock_in, clock_out, clock_in_lat, clock_in_lng, clock_in_accuracy_m, clock_out_lat, clock_out_lng, clock_out_accuracy_m, approval_status")
    .order("clock_in", { ascending:false });
  if(error){ $("employees").innerHTML='<p class="muted">Could not load records.</p>'; return; }
  const { data: photos } = await supabase.from("job_photos").select("time_entry_id, storage_path");
  const photoMap = new Map((photos||[]).map(p=>[p.time_entry_id,p.storage_path]));
  const groups = new Map(); const now = Date.now(); let total=0,active=0,pending=0;
  for(const e of entries||[]){
    const key=(e.worker_name||"").trim() || "Unnamed Worker";
    if(!groups.has(key)) groups.set(key,[]); groups.get(key).push(e);
    const a=new Date(e.clock_in).getTime(), b=e.clock_out?new Date(e.clock_out).getTime():now;
    total += hours(a,b); if(!e.clock_out) active++; if((e.approval_status||"Pending")==="Pending") pending++;
  }
  $("employeeCount").textContent=groups.size; $("activeCount").textContent=active; $("totalHours").textContent=total.toFixed(2); $("pendingCount").textContent=pending;
  const box=$("employees"); box.replaceChildren();
  for(const [name,shifts] of groups){
    let employeeHours=0;
    const employee=el("div","employee");
    const top=el("div","employeeTop"); top.append(el("strong","",name));
    if(shifts.some(s=>!s.clock_out)) top.append(el("span","badge active","CLOCKED IN"));
    employee.append(top);
    const totalLine=el("div","meta","Total: calculating..."); employee.append(totalLine);
    for(const s of shifts){
      const a=new Date(s.clock_in).getTime(), b=s.clock_out?new Date(s.clock_out).getTime():now, h=hours(a,b); employeeHours+=h;
      const shift=el("div","shift"); const grid=el("div","shiftGrid"); const left=el("div");
      left.append(el("div","",new Date(s.clock_in).toLocaleString()));
      left.append(el("div","meta",s.project ? `Project: ${s.project}` : "Project: Unassigned"));
      left.append(el("div","meta",s.clock_out ? `Out: ${new Date(s.clock_out).toLocaleString()}` : "Currently clocked in"));
      left.append(el("strong","",`${h.toFixed(2)} hrs`));
      const status=s.approval_status||"Pending"; left.append(el("div",`badge ${status.toLowerCase()}`,status));
      if(Number.isFinite(s.clock_in_lat)&&Number.isFinite(s.clock_in_lng)){
        const aLink=el("a","mapLink","Open clock-in GPS"); aLink.href=mapUrl(s.clock_in_lat,s.clock_in_lng); aLink.target="_blank"; aLink.rel="noopener"; left.append(el("br")); left.append(aLink);
        left.append(el("div","meta",`Clock-in accuracy: ${Math.round(s.clock_in_accuracy_m||0)} m`));
      }
      if(Number.isFinite(s.clock_out_lat)&&Number.isFinite(s.clock_out_lng)){
        const oLink=el("a","mapLink","Open clock-out GPS"); oLink.href=mapUrl(s.clock_out_lat,s.clock_out_lng); oLink.target="_blank"; oLink.rel="noopener"; left.append(el("br")); left.append(oLink);
        left.append(el("div","meta",`Clock-out accuracy: ${Math.round(s.clock_out_accuracy_m||0)} m`));
      }
      grid.append(left); shift.append(grid);
      const path=photoMap.get(s.id);
      if(path){ const url=await signedPhoto(path); if(url){ const img=el("img","photo"); img.src=url; img.alt="Private jobsite photo"; img.loading="lazy"; shift.append(img); } }
      employee.append(shift);
    }
    totalLine.textContent=`Total: ${employeeHours.toFixed(2)} hrs`; box.append(employee);
  }
  if(!groups.size) box.append(el("p","muted","No employee records yet."));
}

$("loginBtn").addEventListener("click", login);
$("password").addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });
$("refreshBtn").addEventListener("click", loadDashboard);
$("signOutBtn").addEventListener("click", async()=>{ if(liveChannel) await supabase.removeChannel(liveChannel); await supabase.auth.signOut(); location.reload(); });
showDashboard();
</script>
</body>
</html>
