<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Venegas Construction Owner</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#111827;color:#f9fafb;margin:0;padding:20px}
.box{max-width:560px;margin:0 auto;background:#1f2937;border-radius:16px;padding:20px}
h1{margin-top:0}input,button{width:100%;box-sizing:border-box;min-height:48px;border-radius:10px;font-size:16px;padding:11px 12px}
input{border:1px solid #4b5563;background:#111827;color:#fff}
button{margin-top:10px;border:0;background:#b91c1c;color:#fff;font-weight:800}
.muted{color:#9ca3af}.hidden{display:none}.card{margin-top:16px;padding:14px;background:#111827;border-radius:12px}
.record{padding:12px 0;border-bottom:1px solid #374151}.record:last-child{border-bottom:0}
.big{font-size:28px;font-weight:900}
</style>
</head>
<body>
<main class="box">
<h1>Owner Dashboard</h1>
<p class="muted">Private page for records stored on this device.</p>

<div id="login">
<input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="4–8 digit PIN">
<input id="pin2" class="hidden" type="password" inputmode="numeric" maxlength="8" placeholder="Confirm PIN">
<button id="go" type="button">Unlock</button>
<p id="msg" class="muted"></p>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<div class="muted">Total saved hours on this device</div>
<div id="totalHours" class="big">0.00</div>
</div>
<div class="card">
<strong>Shift Records</strong>
<div id="records"><p class="muted">No completed shifts yet.</p></div>
</div>
<button id="lock" type="button">Lock Dashboard</button>
</div>
</main>

<script>
const PINKEY='vc_owner_pin_hash_v2';
const RECORDS_KEY='vc_shift_records_v3';
const ACTIVE_KEY='vc_active_shift_v3';
const $=id=>document.getElementById(id);
const enc=new TextEncoder();

async function hash(s){
  const b=await crypto.subtle.digest('SHA-256',enc.encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function first(){return !localStorage.getItem(PINKEY)}
function setup(){if(first()){$('pin2').classList.remove('hidden');$('go').textContent='Create PIN'}}

function getRecords(){try{return JSON.parse(localStorage.getItem(RECORDS_KEY)||'[]')}catch{return[]}}
function getActive(){try{return JSON.parse(localStorage.getItem(ACTIVE_KEY)||'null')}catch{return null}}

function load(){
  const rec=getRecords();
  const active=getActive();
  let totalMs=rec.reduce((s,r)=>s+Math.max(0,(r.out-r.in)),0);
  if(active) totalMs+=Math.max(0,Date.now()-active.in);
  $('totalHours').textContent=(totalMs/3600000).toFixed(2);

  const box=$('records');
  box.innerHTML='';
  const all=active?[...rec,{...active,out:null}]:rec;

  if(!all.length){
    box.innerHTML='<p class="muted">No shifts saved on this device yet.</p>';
    return;
  }

  all.slice().reverse().forEach(r=>{
    const d=document.createElement('div');
    d.className='record';
    const hrs=((r.out||Date.now())-r.in)/3600000;
    d.innerHTML='<strong>'+r.name+'</strong><br><span class="muted">In: '+new Date(r.in).toLocaleString()+
      (r.out?'<br>Out: '+new Date(r.out).toLocaleString():'<br>Currently clocked in')+
      '</span><div><strong>'+hrs.toFixed(2)+' hrs</strong></div>';
    box.appendChild(d);
  });
}

async function unlock(){
  const p=$('pin').value.trim();
  if(!/^\d{4,8}$/.test(p)){
    $('msg').textContent='Use a 4–8 digit PIN.';
    return;
  }

  if(first()){
    if(p!==$('pin2').value.trim()){
      $('msg').textContent='PINs do not match.';
      return;
    }
    localStorage.setItem(PINKEY,await hash(p));
  }else if(await hash(p)!==localStorage.getItem(PINKEY)){
    $('msg').textContent='Incorrect PIN.';
    return;
  }

  $('login').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  load();
}

$('go').onclick=unlock;
$('lock').onclick=()=>location.reload();
setup();
setInterval(()=>{if(!$('dashboard').classList.contains('hidden'))load()},30000);
</script>
</body>
</html>
