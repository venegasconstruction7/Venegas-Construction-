<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venegas Construction Employee Clock In</title>
<meta name="google-site-verification" content="fsaOTcwZ0_7UJdRddMsFeyx9FMohFloHaNJxjl-LM84">
<meta name="robots" content="index,follow">
<style>
:root{--red:#b91c1c;--green:#18794e;--bg:#f5f5f4;--card:#fff;--ink:#171717;--muted:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(100% - 24px,540px);margin:0 auto;padding:20px 0 36px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:48px;height:48px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}
.brand h1{font-size:22px;margin:0}.brand p{margin:3px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 22px rgba(0,0,0,.05)}
label{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
input{width:100%;min-height:48px;border:1px solid #d1d5db;border-radius:10px;padding:11px 12px;font-size:16px;background:#fff}
.preview{width:100%;max-height:280px;object-fit:cover;border-radius:10px;margin-top:10px}.hidden{display:none!important}
.status{padding:14px;margin:16px 0 6px;background:#f3f4f6;border-radius:10px;text-align:center;font-weight:800}
.btn{width:100%;min-height:50px;border:0;border-radius:10px;color:#fff;font-size:17px;font-weight:900;margin-top:10px}
.in{background:var(--green)}.out{background:var(--red)}.hours{text-align:center;margin-top:16px}
.hours span{display:block;color:var(--muted);font-size:13px}.hours strong{display:block;font-size:34px;margin-top:4px}
.note{font-size:12px;color:var(--muted);text-align:center;line-height:1.45;margin:14px 0 0}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><div class="logo">VC</div><div><h1>Venegas Construction</h1><p>Employee Time Clock</p></div></div>
  <section class="card">
    <label for="name">Your name</label>
    <input id="name" autocomplete="name" placeholder="Enter your name">

    <label for="photo">Jobsite photo</label>
    <input id="photo" type="file" accept="image/*" capture="environment">
    <img id="preview" class="preview hidden" alt="Jobsite photo preview">

    <div id="status" class="status">Connecting...</div>
    <button id="clockIn" class="btn in" type="button">CLOCK IN</button>
    <button id="clockOut" class="btn out" type="button">CLOCK OUT</button>

    <div class="hours"><span>Hours today</span><strong id="hours">0.00</strong></div>
    <p class="note">Your time is saved to the Venegas Construction cloud. Photos are private and available only from the owner dashboard.</p>
  </section>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./config.js";

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);
let user = null;
let currentShift = null;
let photoFile = null;

function msToHours(ms){ return Math.max(0, ms) / 3600000; }

async function ensureUser(){
  const { data: sessionData } = await supabase.auth.getSession();
  if(sessionData.session){
    user = sessionData.session.user;
    return;
  }
  const { data, error } = await supabase.auth.signInAnonymously();
  if(error) throw error;
  user = data.user;
}

async function loadCurrentShift(){
  const { data, error } = await supabase
    .from("time_entries")
    .select("id, worker_name, clock_in, clock_out")
    .eq("user_id", user.id)
    .is("clock_out", null)
    .order("clock_in", { ascending:false })
    .limit(1)
    .maybeSingle();
  if(error) throw error;
  currentShift = data || null;
}

async function loadTodayHours(){
  const start = new Date();
  start.setHours(0,0,0,0);

  const { data, error } = await supabase
    .from("time_entries")
    .select("clock_in, clock_out")
    .eq("user_id", user.id)
    .gte("clock_in", start.toISOString());
  if(error) throw error;

  const now = Date.now();
  let ms = 0;
  for(const r of data || []){
    const a = new Date(r.clock_in).getTime();
    const b = r.clock_out ? new Date(r.clock_out).getTime() : now;
    if(b > a) ms += b - a;
  }
  $("hours").textContent = msToHours(ms).toFixed(2);
}

async function render(){
  await loadCurrentShift();
  await loadTodayHours();

  if(currentShift){
    $("name").value = currentShift.worker_name;
    $("name").disabled = true;
    $("status").textContent = currentShift.worker_name + " — Clocked In";
    $("status").style.background = "#dcfce7";
    $("clockIn").disabled = true;
  }else{
    $("name").disabled = false;
    $("status").textContent = "Not clocked in";
    $("status").style.background = "#f3f4f6";
    $("clockIn").disabled = false;
  }
}

$("photo").addEventListener("change", e => {
  photoFile = e.target.files[0] || null;
  if(!photoFile) return;
  const reader = new FileReader();
  reader.onload = () => {
    $("preview").src = reader.result;
    $("preview").classList.remove("hidden");
  };
  reader.readAsDataURL(photoFile);
});

$("clockIn").addEventListener("click", async () => {
  try{
    const name = $("name").value.trim();
    if(!name){ $("status").textContent = "Enter your name first"; return; }
    if(!photoFile){ $("status").textContent = "Take a jobsite photo first"; return; }

    await loadCurrentShift();
    if(currentShift){ $("status").textContent = "Already clocked in"; return; }

    const { data: inserted, error: insertError } = await supabase
      .from("time_entries")
      .insert({ user_id:user.id, worker_name:name })
      .select("id")
      .single();
    if(insertError) throw insertError;

    const ext = (photoFile.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
    const path = `${user.id}/${inserted.id}/${crypto.randomUUID()}.${ext || "jpg"}`;

    const { error: uploadError } = await supabase.storage
      .from("jobsite-photos")
      .upload(path, photoFile, { upsert:false, contentType:photoFile.type || "image/jpeg" });
    if(uploadError) throw uploadError;

    const { error: photoRowError } = await supabase
      .from("job_photos")
      .insert({ user_id:user.id, time_entry_id:inserted.id, storage_path:path });
    if(photoRowError) throw photoRowError;

    localStorage.setItem("vc_worker_name", name);
    photoFile = null;
    $("photo").value = "";
    $("preview").classList.add("hidden");
    await render();
  }catch(err){
    console.error(err);
    $("status").textContent = "Could not clock in. Check connection.";
  }
});

$("clockOut").addEventListener("click", async () => {
  try{
    await loadCurrentShift();
    if(!currentShift){ $("status").textContent = "Not clocked in"; return; }

    const { error } = await supabase
      .from("time_entries")
      .update({ clock_out:new Date().toISOString() })
      .eq("id", currentShift.id)
      .eq("user_id", user.id);
    if(error) throw error;

    await render();
  }catch(err){
    console.error(err);
    $("status").textContent = "Could not clock out. Check connection.";
  }
});

(async()=>{
  try{
    $("name").value = localStorage.getItem("vc_worker_name") || "";
    await ensureUser();
    await render();
    setInterval(loadTodayHours, 30000);
  }catch(err){
    console.error(err);
    $("status").textContent = "Cloud setup is not connected yet.";
  }
})();
</script>
</body>
</html>
