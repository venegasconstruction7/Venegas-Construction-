<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venegas Construction Employee Clock In</title>
<meta name="description" content="Venegas Construction employee clock in and jobsite photo portal.">
<meta name="google-site-verification" content="fsaOTcwZ0_7UJdRddMsFeyx9FMohFloHaNJxjl-LM84" />
<meta name="robots" content="index,follow">
<style>
:root{--red:#b91c1c;--green:#18794e;--bg:#f5f5f4;--card:#fff;--ink:#171717;--muted:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{width:min(100% - 24px,540px);margin:0 auto;padding:20px 0 36px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}.logo{width:48px;height:48px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{font-size:22px;margin:0}.brand p{margin:3px 0 0;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 22px rgba(0,0,0,.05)}label{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}input{width:100%;min-height:48px;border:1px solid #d1d5db;border-radius:10px;padding:11px 12px;font-size:16px;background:#fff}.preview{width:100%;max-height:280px;object-fit:cover;border-radius:10px;margin-top:10px}.hidden{display:none!important}.status{padding:14px;margin:16px 0 6px;background:#f3f4f6;border-radius:10px;text-align:center;font-weight:800}.btn{width:100%;min-height:50px;border:0;border-radius:10px;color:#fff;font-size:17px;font-weight:900;margin-top:10px}.in{background:var(--green)}.out{background:var(--red)}.hours{text-align:center;margin-top:16px}.hours span{display:block;color:var(--muted);font-size:13px}.hours strong{display:block;font-size:34px;margin-top:4px}.note{font-size:12px;color:var(--muted);text-align:center;line-height:1.45;margin:14px 0 0}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><div class="logo">VC</div><div><h1>Venegas Construction</h1><p>Employee Time Clock</p></div></div>
  <section class="card">
    <label for="name">Your name</label>
    <input id="name" autocomplete="name" placeholder="Enter your name">

    <label for="photo">Jobsite photo</label>
    <input id="photo" type="file" accept="image/*" capture="environment">
    <img id="preview" class="preview hidden" alt="Jobsite photo preview">

    <div id="status" class="status">Not clocked in</div>
    <button id="clockIn" class="btn in" type="button">CLOCK IN</button>
    <button id="clockOut" class="btn out" type="button">CLOCK OUT</button>

    <div class="hours"><span>Hours today</span><strong id="hours">0.00</strong></div>
    <p class="note">Worker access only. Owner controls are on a separate private page.</p>
  </section>
</main>
<script>
let start=null,total=0,photoReady=false;
const $=id=>document.getElementById(id);
function update(){const ms=total+(start?Date.now()-start:0);$('hours').textContent=(ms/3600000).toFixed(2)}
$('photo').addEventListener('change',e=>{const f=e.target.files[0];photoReady=!!f;if(!f)return;const r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').classList.remove('hidden')};r.readAsDataURL(f)});
$('clockIn').addEventListener('click',()=>{const n=$('name').value.trim();if(!n){$('status').textContent='Enter your name first';return}if(!photoReady){$('status').textContent='Take a jobsite photo first';return}if(start){$('status').textContent='Already clocked in';return}start=Date.now();$('status').textContent=n+' — Clocked In';$('status').style.background='#dcfce7';update()});
$('clockOut').addEventListener('click',()=>{if(!start){$('status').textContent='Not clocked in';return}total+=Date.now()-start;start=null;$('status').textContent=$('name').value.trim()+' — Clocked Out';$('status').style.background='#fee2e2';update()});
setInterval(update,1000);update();
</script>
</body>
</html>
