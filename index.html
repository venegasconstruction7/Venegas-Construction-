<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Venegas Construction Employee Clock In</title>
<meta name="google-site-verification" content="fsaOTcwZ0_7UJdRddMsFeyx9FMohFloHaNJxjl-LM84">
<meta name="robots" content="index,follow">
<style>
:root{--red:#b91c1c;--green:#18794e;--blue:#1d4ed8;--bg:#f5f5f4;--card:#fff;--ink:#171717;--muted:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(100% - 24px,560px);margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 0 calc(36px + env(safe-area-inset-bottom))}.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:50px;height:50px;border-radius:13px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{font-size:22px;margin:0}.brand p{margin:3px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 22px rgba(0,0,0,.05)}
label{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}input{width:100%;min-height:48px;border:1px solid #d1d5db;border-radius:10px;padding:11px 12px;font-size:16px;background:#fff}
.preview{width:100%;max-height:280px;object-fit:cover;border-radius:10px;margin-top:10px}.hidden{display:none!important}.status{padding:14px;margin:16px 0 6px;background:#f3f4f6;border-radius:10px;text-align:center;font-weight:800;line-height:1.35}.gps{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.btn{width:100%;min-height:52px;border:0;border-radius:10px;color:#fff;font-size:17px;font-weight:900;margin-top:10px}.btn:disabled{opacity:.5}.in{background:var(--green)}.out{background:var(--red)}.gpsbtn{background:var(--blue)}
.hours{text-align:center;margin-top:16px}.hours span{display:block;color:var(--muted);font-size:13px}.hours strong{display:block;font-size:34px;margin-top:4px}.note{font-size:12px;color:var(--muted);text-align:center;line-height:1.45;margin:14px 0 0}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><div class="logo">VC</div><div><h1>Venegas Construction</h1><p>Employee Time Clock</p></div></div>
  <section class="card">
    <label for="name">Your name</label>
    <input id="name" autocomplete="name" placeholder="Enter your name">

    <label for="project">Project / job</label>
    <input id="project" autocomplete="off" placeholder="Job name or address">

    <label for="photo">Jobsite photo</label>
    <input id="photo" type="file" accept="image/*" capture="environment">
    <img id="preview" class="preview hidden" alt="Jobsite photo preview">

    <div id="status" class="status">Connecting...</div>
    <div id="gpsStatus" class="gps">GPS will be captured when you clock in or out.</div>
    <button id="clockIn" class="btn in" type="button">CLOCK IN</button>
    <button id="clockOut" class="btn out" type="button">CLOCK OUT</button>

    <div class="hours"><span>Hours today</span><strong id="hours">0.00</strong></div>
    <p class="note">Your time, GPS location, and jobsite photo are saved to the Venegas Construction cloud. Photos are private and available only from the owner dashboard.</p>
  </section>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./config.js";

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);
let user = null;
let currentShift = null;
let photoFile = null;
let busy = false;

function msToHours(ms){ return Math.max(0, ms) / 3600000; }
function setStatus(text, ok=false){
  $("status").textContent = text;
  $("status").style.background = ok ? "#dcfce7" : "#f3f4f6";
}
function setBusy(value){
  busy = value;
  $("clockIn").disabled = value || !!currentShift;
  $("clockOut").disabled = value || !currentShift;
}

async function ensureUser(){
  const { data: sessionData } = await supabase.auth.getSession();
  if(sessionData.session){ user = sessionData.session.user; return; }
  const { data, error } = await supabase.auth.signInAnonymously();
  if(error) throw error;
  user = data.user;
}

function getLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){ reject(new Error("GPS is not supported on this device.")); return; }
    $("gpsStatus").textContent = "Getting GPS location...";
    navigator.geolocation.getCurrentPosition(
      pos => {
        const result = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        };
        $("gpsStatus").textContent = `GPS ready - accuracy about ${Math.round(result.accuracy)} m`;
        resolve(result);
      },
      err => reject(new Error(err.code === 1 ? "Location permission is required to clock in or out." : "Could not get GPS location. Try again outside or near a window.")),
      { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
    );
  });
}

async function loadCurrentShift(){
  const { data, error } = await supabase.from("time_entries")
    .select("id, worker_name, project, clock_in, clock_out")
    .eq("user_id", user.id).is("clock_out", null)
    .order("clock_in", { ascending:false }).limit(1).maybeSingle();
  if(error) throw error;
  currentShift = data || null;
}

async function loadTodayHours(){
  if(!user) return;
  const start = new Date(); start.setHours(0,0,0,0);
  const { data, error } = await supabase.from("time_entries")
    .select("clock_in, clock_out").eq("user_id", user.id).gte("clock_in", start.toISOString());
  if(error) throw error;
  const now = Date.now(); let ms = 0;
  for(const r of data || []){
    const a = new Date(r.clock_in).getTime();
    const b = r.clock_out ? new Date(r.clock_out).getTime() : now;
    if(b > a) ms += b - a;
  }
  $("hours").textContent = msToHours(ms).toFixed(2);
}

async function render(){
  await loadCurrentShift();
  await loadTodayHours();
  if(currentShift){
    $("name").value = currentShift.worker_name;
    $("project").value = currentShift.project || "";
    $("name").disabled = true; $("project").disabled = true;
    setStatus(currentShift.worker_name + " - Clocked In", true);
  } else {
    $("name").disabled = false; $("project").disabled = false;
    setStatus("Not clocked in");
  }
  setBusy(false);
}

$("photo").addEventListener("change", e => {
  photoFile = e.target.files[0] || null;
  if(!photoFile){ $("preview").classList.add("hidden"); return; }
  const reader = new FileReader();
  reader.onload = () => { $("preview").src = reader.result; $("preview").classList.remove("hidden"); };
  reader.readAsDataURL(photoFile);
});

$("clockIn").addEventListener("click", async () => {
  if(busy) return;
  try{
    const name = $("name").value.trim();
    const project = $("project").value.trim();
    if(!name){ setStatus("Enter your name first"); return; }
    if(!photoFile){ setStatus("Take a jobsite photo first"); return; }
    setBusy(true);
    await loadCurrentShift();
    if(currentShift){ setStatus("Already clocked in", true); return; }
    const loc = await getLocation();

    const { data: inserted, error: insertError } = await supabase.from("time_entries")
      .insert({
        user_id:user.id, worker_name:name, project:project || "Unassigned",
        clock_in_lat:loc.lat, clock_in_lng:loc.lng, clock_in_accuracy_m:loc.accuracy,
        latitude:loc.lat, longitude:loc.lng, accuracy_m:loc.accuracy,
        action:"clock_in", event_time:new Date().toISOString()
      }).select("id").single();
    if(insertError) throw insertError;

    const ext = (photoFile.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
    const path = `${user.id}/${inserted.id}/${crypto.randomUUID()}.${ext || "jpg"}`;
    const { error: uploadError } = await supabase.storage.from("jobsite-photos")
      .upload(path, photoFile, { upsert:false, contentType:photoFile.type || "image/jpeg" });
    if(uploadError) throw uploadError;

    const { error: photoRowError } = await supabase.from("job_photos")
      .insert({ user_id:user.id, time_entry_id:inserted.id, storage_path:path });
    if(photoRowError) throw photoRowError;

    localStorage.setItem("vc_worker_name", name);
    localStorage.setItem("vc_project", project);
    photoFile = null; $("photo").value = ""; $("preview").classList.add("hidden");
    await render();
  }catch(err){
    console.error(err); setStatus(err.message || "Could not clock in. Check connection."); setBusy(false);
  }
});

$("clockOut").addEventListener("click", async () => {
  if(busy) return;
  try{
    setBusy(true);
    await loadCurrentShift();
    if(!currentShift){ setStatus("Not clocked in"); setBusy(false); return; }
    const loc = await getLocation();
    const { error } = await supabase.from("time_entries").update({
      clock_out:new Date().toISOString(),
      clock_out_lat:loc.lat, clock_out_lng:loc.lng, clock_out_accuracy_m:loc.accuracy,
      latitude:loc.lat, longitude:loc.lng, accuracy_m:loc.accuracy,
      action:"clock_out", event_time:new Date().toISOString()
    }).eq("id", currentShift.id).eq("user_id", user.id);
    if(error) throw error;
    await render();
  }catch(err){
    console.error(err); setStatus(err.message || "Could not clock out. Check connection."); setBusy(false);
  }
});

(async()=>{
  try{
    $("name").value = localStorage.getItem("vc_worker_name") || "";
    $("project").value = localStorage.getItem("vc_project") || "";
    await ensureUser(); await render();
    setInterval(loadTodayHours, 30000);
    supabase.channel("employee-time-live")
      .on("postgres_changes", { event:"*", schema:"public", table:"time_entries", filter:`user_id=eq.${user.id}` }, () => render().catch(console.error))
      .subscribe();
  }catch(err){ console.error(err); setStatus("Cloud setup is not connected yet."); }
})();
</script>
</body>
</html>
